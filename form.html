<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment | Galaxy Boys Hostel</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap');

    body {
        margin: 0;
        font-family: "PT Sans", sans-serif;
        font-size: 18px;
        color: #24344a;

        background-image: url('/home/pranav/learnig/web_tech_project/background.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        min-height: 100vh;
    }

    header {
        background-color: #1a1a1a;
        color: white;
        text-align: center;
        padding: 15px;
    }

    .brand {
        font-size: 26px;
        font-weight: bold;
        margin: 0 0 10px;
    }

    nav {
        text-align: center;
    }

    nav a {
        color: white;
        text-decoration: none;
        padding: 8px 12px;
        margin: 5px;
        display: inline-block;
    }

    nav a:hover {
        background-color: #315b7b;
    }

    main {
        width: 85%;
        max-width: 700px;
        margin: 30px auto;
        padding: 25px;
        background-color: white;
        border-radius: 8px;
    }

    h1 {
        font-size: 32px;
    }

    h2 {
        font-size: 24px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #8193a2;
        border-radius: 4px;
        font-family: "PT Sans", sans-serif;
        font-size: 16px;
    }

    textarea {
        resize: vertical;
    }

    small {
        display: block;
        margin-top: 5px;
        font-size: 14px;
    }

    .button {
        display: inline-block;
        background-color: #185c85;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        cursor: pointer;
    }

    .button:hover {
        background-color: #103e5c;
    }

    button {
        margin-top: 20px;
    }

    #message {
        font-weight: bold;
    }

    footer {
        background-color: #1a1a1a;
        color: white;
        text-align: center;
        padding: 15px;
    }

    @media (max-width: 650px) {
        main {
            width: 90%;
            padding: 15px;
        }
    }
</style>
</head>
<body>
    <header>
        <p class="brand">Galaxy Boys Hostel</p>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="contact.html">Contact Us</a>
            <a href="mess.html">Mess</a>
            <a href="hostel.html">Hostel</a>
        </nav>
    </header>

    <main>
        <h1>Enrollment Form</h1>
        <p>All fields are required.</p>
        <p id="form-note">Fill all details carefully. Call <a href="tel:+918412833105">84128 33105</a> to complete enrollment.</p>
        <form id="enrollment-form" aria-describedby="form-note">
            <label for="full-name">Full Name</label>
            <input id="full-name" name="full-name" type="text" autocomplete="name" required>

            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit phone number without spaces" aria-describedby="phone-help" required>
            <small id="phone-help">Enter 10 digits without spaces or the country code.</small>

            <label for="email">Email ID</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="address">Permanent Address</label>
            <textarea id="address" name="address" rows="4" autocomplete="street-address" required></textarea>

            <label for="identity">Identity Proof (image)</label>
            <input id="identity" name="identity" type="file" accept="image/*" aria-describedby="identity-help" required>
            <button class="button" type="submit">Check Enrollment Details</button>
            <p id="message" role="status"></p>
        </form>
    </main>

    <footer>Galaxy Boys Hostel &bull; Wanadongri, Nagpur &bull; 84128 33105</footer>
    <script>

        document.getElementById("enrollment-form").addEventListener("submit", function (event) {
            event.preventDefault(); 
            var identity = document.getElementById("identity").files[0];
            var message = document.getElementById("message");

            if (!identity.type.startsWith("image/")) {
                message.textContent = "Please select an image file for identity proof.";
                return;
            }

            alert("WELCOME TO GALEXY FAMILY **your enrollment id is 1324**")
        });
    </script>
</body>
</html>
